schema_version: 1
project: lomway
initiative: public-generalization
status: completed
design_source: docs/PUBLIC_GENERALIZATION_DESIGN.md
human_readable_backlog: docs/PUBLIC_GENERALIZATION_TASKS.md

rules:
  - preserve_current_production_baseline
  - never_publish_private_identifiers_or_secrets
  - backend_process_lifecycle_is_not_core_responsibility
  - openai_swibo_sops_are_optional_integrations
  - never_automatically_retry_mutations
  - run_focused_tests_for_each_change
  - avoid_unrelated_refactors
  - preserve_current_six_backend_regression

lanes:
  A: Config/Core model
  B: Backend registry/namespace
  C: Host/router/health
  D: CLI/platform independence
  E: Optional integrations
  F: Tests/release/docs

