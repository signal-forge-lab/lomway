#
# Declares which upstream OSS project or internal capability sits behind a
# tool or action, plus English/Japanese aliases, so `lomway_search_tools` can
# find direct, deferred, and internal capabilities by name, alias, or intent.
#
# Public-repository rules: declare names, aliases, and summaries only. Never
# add machine paths, ports, URLs, hostnames, tokens, or account names here.
#
# Matching keys (exactly one per [[capability]]):
#   tool    = exact client-visible tool name
#   backend = configured backend id; applies to every tool of that backend
#             and to its `unverified` placeholder when no manifest is cached
# [[internal]] entries describe capabilities with no MCP tool of their own,
# reached through an existing tool named by `via`. `via` is one tool name or
# an ordered list; the first one present in the gateway's current direct
# tools/list is used, and the entry is omitted entirely when none is present,
# so search never routes callers to a tool this deployment does not expose.
#
# Tool-keyed [[capability]] entries only annotate tools that are actually
# listed: a declaration for a tool the running profile does not expose (for
# example workbridge_* in a Coding-Tools-only profile) contributes nothing.

schema_version = 1

# Optional aliases for dynamically discovered skills. A declaration is only
# used when that skill exists; it does not expose or install a missing skill.
[[capability]]
tool = "skill:codebase-design"
domain = "skills"
aliases = [
  "既存コードの設計", "モジュール設計", "コード設計", "保守性改善",
  "インターフェース設計", "設計の見直し",
]

