# Lomway capability declarations (schema_version = 1).
#
# Declares which upstream OSS project or internal capability sits behind a
# tool or action, plus English/Japanese aliases, so `lomway_search_tools` can
# find direct, deferred, and internal capabilities by name, alias, or intent.
#
# Public-repository rules: declare names, aliases, and summaries only. Never
# add machine paths, ports, URLs, hostnames, tokens, or account names here.
#
# Matching keys (exactly one per [[capability]]):
#   tool    = exact client-visible tool name
#   backend = configured backend id; applies to every tool of that backend
#             and to its `unverified` placeholder when no manifest is cached
# [[internal]] entries describe capabilities with no MCP tool of their own,
# reached through an existing tool named by `via`.

schema_version = 1

