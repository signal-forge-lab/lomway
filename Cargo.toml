[package]
name = "lomway"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Lomway: a thin local aggregation boundary for trusted MCP backends"
readme = "README.md"
keywords = ["mcp", "proxy", "gateway", "llm", "ai"]
categories = ["development-tools"]
repository = "https://github.com/signal-forge-lab/lomway"
# Release process and gates: docs/RELEASE.md (+ja) and docs/CHANGELOG.md.

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
mcp-proxy = { version = "=0.4.3", default-features = false, features = ["protocol-2026-07-28"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
toml = "1"
tower = { version = "0.5", features = ["timeout"] }
tower-mcp = { version = "=0.18.2", features = ["http", "http-client", "proxy", "protocol-2026-07-28"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "form", "json"] }

[dev-dependencies]
schemars = "1"
tempfile = "3"
